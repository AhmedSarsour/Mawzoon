name: mawzoon
description: >-
  موزون — Mawzoon. The official ordering application for a premium, balanced
  dining restaurant. Tri-partitioned plates: Protein + Smart Carb + Vital Fiber.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Motion. Tier 2/3 choreography leans on declarative effect chains so that
  # every animation stays on Transform/Opacity and never triggers a layout pass.
  flutter_animate: ^4.5.0

  # Typography. Plus Jakarta Sans (latin metrics) + IBM Plex Sans Arabic.
  google_fonts: ^6.2.1

  # Module 10: the post-meal reflection. Pinned exact: this plugin's scheduling
  # API has changed shape across majors, and the platform patch script
  # (tool/patch_platforms.dart) is written against this version's setup.
  flutter_local_notifications: 22.3.1
  # zonedSchedule needs a TZ database and the device's zone name.
  timezone: 0.11.1
  flutter_timezone: 5.1.0
  # Reflections stay on the device. One JSON key; nothing leaves the phone.
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
